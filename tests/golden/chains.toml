# Representative positional-chain golden cases. Tolerances are normalized
# full-scale decoded-sample metrics; exact structural edits use zero tolerance.

[id.chain_editing_trim_reverse_pad]
input = "chains/stereo_steps.wav"
corpus_id = "chains/stereo_steps"
auralis = ["trim", "2", "7", "reverse", "pad", "1", "2"]
sox_ng = ["trim", "2s", "7s", "reverse", "pad", "1s", "2s"]
max_abs = 0.0
rms = 0.0
snr_db = 120.0

[id.chain_level_gain_dcshift_gain]
input = "chains/stereo_multitone.wav"
corpus_id = "chains/stereo_multitone"
auralis = ["gain", "-3", "dcshift", "0.125", "gain", "-1"]
sox_ng = ["gain", "-3", "dcshift", "0.125", "gain", "-1"]
max_abs = 0.000031
rms = 0.000031
snr_db = 90.0

[id.chain_gain_headroom_reclaim]
input = "chains/stereo_multitone.wav"
corpus_id = "chains/stereo_multitone"
auralis = ["gain", "-h", "-6", "gain", "-r"]
sox_ng = ["gain", "-h", "-6", "gain", "-r"]
max_abs = 0.000031
rms = 0.000031
snr_db = 90.0

[id.chain_boundary_mix_gain_noop]
inputs = ["combine/stereo_front.wav", "combine/stereo_tail.wav"]
corpus_ids = ["combine/stereo_front", "combine/stereo_tail"]
combine = "mix"
auralis = ["gain", "-3", ":", "gain", "0", ":", "dcshift", "0"]
sox_ng = ["gain", "-3", ":", "gain", "0", ":", "dcshift", "0"]
max_abs = 0.0
rms = 0.0
snr_db = 120.0

[id.chain_multi_input_mix_gain_reverse]
inputs = ["combine/stereo_front.wav", "combine/stereo_tail.wav"]
corpus_ids = ["combine/stereo_front", "combine/stereo_tail"]
combine = "mix"
auralis = ["gain", "-3", "reverse"]
sox_ng = ["gain", "-3", "reverse"]
max_abs = 0.000031
rms = 0.000031
snr_db = 90.0

[id.chain_output_channels_gain_reverse]
input = "auto/stereo_channels.wav"
corpus_id = "auto/stereo_channels"
output_channels = 1
sox_ng_auto_channels = true
auralis = ["gain", "-3", "reverse"]
sox_ng = ["gain", "-3", "reverse"]
max_abs = 0.000031
rms = 0.000031
snr_db = 90.0

[id.chain_filter_fade_gain]
input = "chains/stereo_ramp_tone.wav"
corpus_id = "chains/stereo_ramp_tone"
auralis = ["fade", "t", "5", "gain", "-2"]
sox_ng = ["fade", "t", "5s", "gain", "-2"]
max_abs = 0.000031
rms = 0.000031
snr_db = 90.0
