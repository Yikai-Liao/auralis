[workspace]
members = [
    "crates/auralis",
    "crates/auralis-aiff",
    "crates/auralis-au",
    "crates/auralis-cli",
    "crates/auralis-codec",
    "crates/auralis-core",
    "crates/auralis-dsp",
    "crates/auralis-effects",
    "crates/auralis-flac",
    "crates/auralis-fuzz-targets",
    "crates/auralis-op",
    "crates/auralis-raw",
    "crates/auralis-simd",
    "crates/auralis-testkit",
    "crates/auralis-wav",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/sox-rs/auralis"
rust-version = "1.95"
version = "0.0.0"

[workspace.dependencies]
aifc = "0.7.0"
claxon = "0.4.3"
clap = "4.5.53"
flacenc = { version = "0.5.1", default-features = false }
hound = "3.5.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
symphonia = { version = "0.5.5", default-features = false, features = ["pcm", "wav"] }
thiserror = "2.0.17"
toml = "0.9.8"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
realfft = "3.5.0"
rustfft = "6.4.1"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = "warn"
