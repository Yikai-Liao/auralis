[package]
name = "auralis-cli"
description = "Command-line interface for Auralis."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "auralis"
path = "src/main.rs"

[features]
default = []
simd = ["auralis/simd", "auralis-wav/simd"]

[lints]
workspace = true

[dependencies]
auralis = { path = "../auralis" }
auralis-wav = { path = "../auralis-wav" }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
shlex = "1.3.0"
toml.workspace = true
