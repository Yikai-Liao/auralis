[package]
name = "auralis-effects"
description = "Typed audio effects for Auralis."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
simd = ["auralis-dsp/simd", "auralis-simd/simd"]

[dependencies]
auralis-core = { path = "../auralis-core" }
auralis-dsp = { path = "../auralis-dsp" }
auralis-op = { path = "../auralis-op" }
auralis-simd = { path = "../auralis-simd", default-features = false }
realfft.workspace = true
rustfft.workspace = true
thiserror.workspace = true

[dev-dependencies]
auralis-testkit = { path = "../auralis-testkit" }
proptest.workspace = true

[lints]
workspace = true
